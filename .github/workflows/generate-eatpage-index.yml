name: Generate Eat Page & Recipes Index (SEO)

on:
  push:
    branches:
      - master
      - main
    paths:
      - "tool/eatpage/data/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate Eat Page & Recipes index.html
        run: |
          node scripts/gen-eatpage.js

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add tool/eatpage/index.html tool/eatpage/recipes.html
          git commit -m "chore: auto-generate eatpage index with initial data for SEO" || echo "No changes to commit"
          
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
