<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Prompt 收藏頁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Prompt 收藏頁</h1>
  <div id="prompt-container" class="prompt-container"></div>
  
  <dialog id="fullTextDialog" class="full-text-dialog">
    <div class="dialog-header">
      <h3 id="dialogTitle"></h3>
      <button class="close-btn" onclick="document.getElementById('fullTextDialog').close()">✕</button>
    </div>
    <pre id="dialogContent" class="dialog-content"></pre>
  </dialog>

  <script type="module" src="script.js"></script>
</body>
</html>
